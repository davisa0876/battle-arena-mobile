name: CI

# NOTE: This workflow only runs static checks (lint + typecheck).
# There is no Android emulator or iOS simulator in CI, so native runtime
# behaviour (Expo Go / dev client, device networking to the API, haptics,
# navigation on real devices, etc.) remains a MANUAL verification step.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint and typecheck (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
